    if (ch === "lin") return "Linear needs every first difference to be the same. Check yours.";
    if (ch === "quad") return kind === "lin" ? "The first differences are already all the same. What does that tell you?" : "Quadratic needs every second difference to be the same. Check yours.";
    return kind === "lin" ? "Look at the first differences. Are they all the same?" : "Look at the second differences. Are they all the same?";
  }

  function stepsD(id, p) {
    const list = a => a.map(fmt).join(", ");
    if (id === "d1") return p.d1.map((d, i) => `${fmt(p.ys[i + 1])} ${MINUS} ${paren(p.ys[i])} = ${fmt(d)}`);
    if (id === "d2") return p.d2.map((d, i) => `${fmt(p.d1[i + 1])} ${MINUS} ${paren(p.d1[i])} = ${fmt(d)}`);
    if (id === "opens") return p.kind !== "quad"
      ? ["Only a parabola opens up or down", `This relation is ${p.kind === "lin" ? "linear" : "neither"}`]
      : [`The second differences are ${fmt(p.d2[0])}`, `That is ${p.d2[0] > 0 ? "positive" : "negative"}, so a is ${p.d2[0] > 0 ? "positive" : "negative"} and it opens ${p.d2[0] > 0 ? "up" : "down"}`, `The vertex is a ${p.d2[0] > 0 ? "minimum" : "maximum"}`];
    if (p.kind === "lin") return [`First differences: ${list(p.d1)}`, "All the same, so it is linear", "The points make a straight line"];
    const s = [`First differences: ${list(p.d1)} (not all the same)`, `Second differences: ${list(p.d2)}`];
    if (p.kind === "quad") s.push("All the same, so it is quadratic", "The points make a parabola");
    else s.push("Not all the same either, so it is neither", "The points make neither a line nor a parabola");
    return s;
  }

  function checkD() {
    const p = cur.d;
    if (!p || p.done) return;
    const first = p.tries === 0;
    const rows = {};
    qsa("#dQs .q").forEach(el => { rows[el.dataset.id] = el; });
    const in1 = cellInputs(1), in2 = cellInputs(2);
    const v1 = in1.map(i => parseNum(i.value)), v2 = in2.map(i => parseNum(i.value));
    const ok1 = v1.map((t, i) => near(t, p.d1[i])), ok2 = v2.map((t, i) => near(t, p.d2[i]));
    const all1 = ok1.every(Boolean), all2 = ok2.every(Boolean);
    const blank2 = in2.every(i => i.value.trim() === "");
    const need2 = p.kind !== "lin";
    const chosen = rows.type.querySelector("input:checked");
    const ch = chosen ? chosen.value : null;
    const tOK = ch === p.kind;
    // the opening direction only counts for a quadratic, and is marked at the end so it cannot give the type away
    const needO = p.kind === "quad", oWant = p.d2[0] > 0 ? "up" : "down";
    const oOK = () => { const c = rows.opens.querySelector("input:checked"); return !!c && c.value === oWant; };
    if (first) {
      record("d:d1", all1); p.first.d1 = all1;
      if (need2) { record("d:d2", all2); p.first.d2 = all2; } else p.first.d2 = blank2 || all2;
      record(`d:${p.kind}`, tOK); p.first.type = tOK;
      if (needO) record("d:opens", oOK());
      p.first.opens = needO ? oOK() : true;
      saveStats();
    }
    const paint = (ins, oks, ans) => ins.forEach((inp, i) => {
      if (inp.disabled) return;
      inp.classList.remove("bad", "good");
      if (oks[i]) { inp.value = fmt(ans[i]); inp.classList.add("good"); inp.disabled = true; }
      else if (first) inp.classList.add("bad");
      else { inp.value = fmt(ans[i]); inp.classList.add("bad"); inp.disabled = true; }
    });
    let open = 0;
    if (!rows.d1.dataset.state) {
      paint(in1, ok1, p.d1);
      if (all1) { lockQ(rows.d1, "ok"); rows.d1.querySelector(".res").textContent = ""; }
      else if (!first) { lockQ(rows.d1, "bad"); rows.d1.querySelector(".res").textContent = "Corrected in the table."; }
      else { retryQ(rows.d1, hintD1(v1, p)); open++; }
    }
    if (!rows.d2.dataset.state && !(blank2 && !need2)) {
      paint(in2, ok2, p.d2);
      if (all2) { lockQ(rows.d2, "ok"); rows.d2.querySelector(".res").textContent = ""; }
      else if (!first) { lockQ(rows.d2, "bad"); rows.d2.querySelector(".res").textContent = "Corrected in the table."; }
      else { retryQ(rows.d2, hintD2(v2, v1, all1, blank2, p)); open++; }
    }
    if (!rows.type.dataset.state) {
      if (tOK) { lockQ(rows.type, "ok"); rows.type.querySelector(".res").textContent = ""; }
      else if (!first) { lockQ(rows.type, "bad"); rows.type.querySelector(".res").textContent = `Answer: ${KIND[p.kind]}`; }
      else { retryQ(rows.type, hintType(ch, p.kind)); open++; }
    }
    p.tries++;
    if (open === 0) {
      p.done = true;
      if (!rows.d2.dataset.state) {
        // a linear table never needed the second column
        lockQ(rows.d2, "ok");
        rows.d2.querySelector(".mark").textContent = "";
        rows.d2.querySelector(".res").textContent = "Not needed. The first differences are already the same.";
        in2.forEach(i => { i.value = "0"; i.disabled = true; i.classList.remove("bad"); i.classList.add("ghost"); });
      }
      if (needO) {
        const good = oOK();
        lockQ(rows.opens, good ? "ok" : "bad");
        if (!good) rows.opens.querySelector(".res").textContent = `Answer: ${oWant === "up" ? "Up" : "Down"}`;
      } else {
        qsa("input", rows.opens).forEach(i => { i.checked = false; });
        lockQ(rows.opens, "ok");
        rows.opens.querySelector(".mark").textContent = "";
        rows.opens.querySelector(".res").textContent = "Not needed. Only a parabola opens up or down.";
      }
      closeOut("dQs", p, stepsD, "dScore");
      $("dNote").textContent = "Tap any row to see the steps.";
      $("plot").hidden = false;
      if (window.matchMedia("(max-width: 820px)").matches) window.scrollTo({ top: 0, behavior: "smooth" });
    } else $("dNote").textContent = "Fix the ones marked ✗, then check again.";
    syncUI();
    requestAnimationFrame(resizeD);
  }

  function resizeD() { sizeView(VD); drawD(); }

  function drawD() {
    const v = VD, p = cur.d;
    if (!v.W || !p) return;
    if (p.given === "table") {
      if (!p.done) return;
      v.ctx.clearRect(0, 0, v.W, v.H);
      const pad = 30;
      const x0 = Math.min(0, p.xs[0]) - 0.5, x1 = Math.max(0, p.xs[p.xs.length - 1]) + 0.5;
      let y0 = Math.min(0, ...p.ys), y1 = Math.max(0, ...p.ys);
      const span = Math.max(1, y1 - y0);
      y0 -= span * 0.06; y1 += span * 0.06;
      v.sx = (v.W - 2 * pad) / (x1 - x0);
      v.sy = (v.H - 2 * pad) / (y1 - y0);
      v.ox = pad - x0 * v.sx;
      v.oy = v.H - pad + y0 * v.sy;
      const ys = [1, 2, 5, 10, 20, 50].find(s => span / s <= 8) || 100;
      grid(v, 1, ys, 1, ys, 12);
      curve(v, p.f, css("--c1"), 2.5, 0.6);
      p.xs.forEach((x, i) => dot(v, X(v, x), Y(v, p.ys[i]), css("--ink"), 6));
      return;
    }
    // an equation shows its graph once he is done; a shape question shows it from the start
    if (p.given === "eq" && !p.done) return;
    v.ctx.clearRect(0, 0, v.W, v.H);
    const tall = p.given === "eq" ? 2 : 1;
    v.sx = v.W / 14; v.sy = v.H / (14 * tall);
    v.ox = v.W / 2; v.oy = v.H / 2;
    grid(v, 1, tall, 2, 2 * tall, 11);
    curve(v, p.f, css("--curve"), 3);
  }

  // ---------- classify from an equation: the degree ----------
  const SUP = ["", "", "²", "³", "⁴", "⁵", "⁶"];
  const polyMul = (A, B) => {
    const R = Array(A.length + B.length - 1).fill(0);
    A.forEach((a, i) => B.forEach((b, j) => { R[i + j] += a * b; }));
    return R;
  };
  // terms are [coefficient, exponent] pairs, written in the order given
  function termsStr(terms) {
    let out = "";
    terms.forEach(([c, e], i) => {
      const mag = Math.abs(c), body = (mag === 1 && e > 0 ? "" : String(mag)) + (e > 0 ? "x" + SUP[e] : "");
      out += i === 0 ? (c < 0 ? MINUS : "") + body : ` ${c < 0 ? MINUS : "+"} ${body}`;
    });
    return out;
  }
  const polyTerms = P => P.map((c, e) => [c, e]).filter(t => t[0] !== 0).reverse();
  const polyFn = P => x => P.reduce((sum, c, e) => sum + c * Math.pow(x, e), 0);

  function genDegree(prev) {
    const t = Math.random();
    for (;;) {
      let text, P, brackets = false, lead, firstExp;
      if (t < 0.45) {
        const deg = pick([1, 1, 2, 2, 2, 3, 4, 5, 6]);
        const terms = [[pick([1, 1, 1, 2, 3, 4, 8, -1]), deg]];
        const lower = [];
        for (let e = deg - 1; e >= 0; e--) if (Math.random() < (deg <= 2 ? 0.7 : 0.35)) lower.push([pick([1, 2, 3, 4, 5, -1, -2, -3]), e]);
        if (!lower.length && deg === 1) lower.push([pick([-5, -3, 1, 2, 7]), 0]);
        terms.push(...lower.slice(0, 2));
        // half the time the highest exponent is not written first
        if (terms.length > 1 && Math.random() < 0.5) terms.push(terms.shift());
        if (terms[0][0] < 0 && terms.length > 1 && terms[1][0] > 0) [terms[0], terms[1]] = [terms[1], terms[0]];
        text = termsStr(terms);
        P = Array(deg + 1).fill(0);
        terms.forEach(([c, e]) => { P[e] += c; });
        lead = terms.find(x => x[1] === deg)[0]; firstExp = terms[0][1];
      } else {
        brackets = true;
        const r = pick([-5, -4, -3, -2, -1, 1, 2, 3, 4, 5]), s = pick([-5, -4, -3, -2, -1, 1, 2, 3, 4, 5]), a = pick([1, 1, 2, 3, -1, -2]);
        if (t < 0.65) { text = facStr(a, r, s); P = polyMul([a], polyMul([-r, 1], [-s, 1])); }
        else if (t < 0.75) { if (r === s) continue; text = `x${factor(r)}${factor(s)}`; P = polyMul([0, 1], polyMul([-r, 1], [-s, 1])); }
        else if (t < 0.9) { text = vtxStr(a, r, s); P = polyMul([a], polyMul([-r, 1], [-r, 1])); P[0] += s; }
        else { if (a === 1 || a === -1) continue; text = `${a < 0 ? MINUS : ""}${Math.abs(a)}${factor(r)}`; P = polyMul([a], [-r, 1]); }
        lead = P[P.length - 1]; firstExp = P.length - 1;
      }
      const deg = P.length - 1;
      if (P[deg] === 0 || (prev && prev.text === text)) continue;
      return { given: "eq", text, P, deg, brackets, lead, firstExp, kind: deg === 1 ? "lin" : deg === 2 ? "quad" : "nei", f: polyFn(P), expanded: termsStr(polyTerms(P)) };
    }
  }

  const KIND_OPTS = [["lin", "Linear"], ["quad", "Quadratic"], ["nei", "Neither"]];
  function showGiven(given) {
    $("dt").hidden = given !== "table";
    $("dEq").hidden = given !== "eq";
    $("plot").hidden = given !== "graph";
    $("dNote").textContent = "";
    $("dScore").textContent = "";
  }
  const dRetry = () => { $("dNote").textContent = "Fix the ones marked ✗, then check again."; };

  function newDegree() {
    const p = genDegree(cur.d);
    Object.assign(p, { tries: 0, done: false, sel: null, first: {} });
    cur.d = p;
    $("dEq").textContent = `y = ${p.text}`;
    $("dQs").innerHTML = row("degree", "Degree", box("d-deg", "Degree")) + row("eqtype", "Type", segMini("d-etype", KIND_OPTS));
    showGiven("eq");
    syncUI();
  }
  const DEG = {
    list: "dQs", score: "dScore",
    grade: (id, el, p) => (id === "degree" ? numGrade(el, [p.deg]) : radGrade(el, p.kind)),
    answer: (id, p) => (id === "degree" ? String(p.deg) : KIND[p.kind]),
    diag(id, p, n) {
      if (id !== "degree" || Number.isNaN(n[0])) return null;
      if (p.brackets && p.deg > 1 && near(n[0], 1)) return "Each bracket has an x. Expand first, then find the highest exponent.";
      if (Math.abs(p.lead) !== p.deg && near(n[0], Math.abs(p.lead))) return "That is a coefficient. The degree is an exponent.";
      if (p.firstExp !== p.deg && near(n[0], p.firstExp)) return "Check every term. The highest exponent is not always written first.";
      return null;
    },
    hint: (id, p) => (id === "degree" ? (p.brackets ? "Expand the brackets, then find the highest exponent." : "Find the highest exponent on x.") : "Degree 1 is linear. Degree 2 is quadratic. Any other degree is neither."),
    steps(id, p) {
      if (id === "degree") return p.brackets
        ? [`Expand: y = ${p.expanded}`, `The highest exponent is ${p.deg}${p.deg === 1 ? " (x means x¹)" : ""}`]
        : ["Look at the exponent on each x", `The highest exponent is ${p.deg}${p.deg === 1 ? " (x means x¹)" : ""}`];
      return [`The degree is ${p.deg}`,
        p.deg === 1 ? "Degree 1 means linear" : p.deg === 2 ? "Degree 2 means quadratic" : `Degree ${p.deg} is not 1 or 2, so it is neither`,
        p.deg === 1 ? "Its graph is a straight line" : p.deg === 2 ? "Its graph is a parabola" : "Its graph is not a line and not a parabola"];
    },
    done() { $("dNote").textContent = "Tap any row to see the steps."; $("plot").hidden = false; },
    retry: dRetry
  };

  // ---------- classify from a graph: the shape ----------
  function genShape(prev) {
    const kind = pick(["lin", "quad", "quad", "nei", "nei"]);
    for (;;) {
      const h = ri(-3, 3), k = ri(-3, 3), sg = pick([1, -1]);
      let f, shape = kind;
      if (kind === "lin") { const m = sg * pick([0.5, 1, 2, 3]); f = x => m * x + k; }
      else if (kind === "quad") { const a = sg * pick([0.5, 1, 2]); f = x => a * (x - h) * (x - h) + k; }
      else {
        shape = pick(["cubic", "vee", "exp"]);
        if (shape === "cubic") f = x => sg * 0.5 * Math.pow(x - h, 3) + k;
        else if (shape === "vee") { const m = sg * pick([1, 2]); f = x => m * Math.abs(x - h) + k; }
        else f = x => sg * Math.pow(2, x - h) + k;
      }
      const sig = `${shape}${sg}${h}${k}`;
      if (prev && prev.sig === sig) continue;
      return { given: "graph", kind, shape, f, sig };
    }
  }
  function newShape() {
    const p = genShape(cur.d);
    Object.assign(p, { tries: 0, done: false, sel: null, first: {} });
    cur.d = p;
    $("dQs").innerHTML = row("gtype", "Type", segMini("d-gtype", KIND_OPTS));
    showGiven("graph");
    syncUI();
    requestAnimationFrame(resizeD);
  }
  const SHAPE = {
    list: "dQs", score: "dScore",
    grade: (id, el, p) => radGrade(el, p.kind),
    answer: (id, p) => KIND[p.kind],
    diag: () => null,
    hint: () => "A straight line is linear. A parabola is quadratic. Any other shape is neither.",
    steps(id, p) {
      if (p.kind === "lin") return ["The graph is one straight line", "A line is the shape of a linear relation"];
      if (p.kind === "quad") return ["The graph is a smooth U shape with one turning point: a parabola", "A parabola is the shape of a quadratic relation"];
      return [p.shape === "cubic" ? "The curve bends two ways, so it is not a parabola" : p.shape === "vee" ? "It has a sharp corner, so it is not a parabola, and it is not one straight line" : "It has no turning point: flat on one side and steep on the other",
        "Not a line and not a parabola, so it is neither"];
    },
    done() { $("dNote").textContent = "Tap the row to see why."; },
    retry: dRetry
  };

  // table of values, equation or graph: her three ways to tell
  let lastGiven = [];
  function newDiff() {
    const r = Math.random();
    let given = r < 0.5 ? "table" : r < 0.8 ? "eq" : "graph";
    if (lastGiven.length >= 2 && lastGiven.every(g => g === given)) given = given === "table" ? "eq" : "table";
    lastGiven = [...lastGiven, given].slice(-2);
    if (given === "table") newTable(); else if (given === "eq") newDegree(); else newShape();
  }

  // =====================================================================
  // THINK (reasoning from the properties, the way she sketches it)
  // =====================================================================
  function genThink(prev) {
    const type = pick(["pts", "sign", "count"].filter(t => !prev || t !== prev.type));
    for (;;) {
      const up = Math.random() < 0.5, clue = pick(["diff", "diff", "a", "opens"]);
      let p;
      if (type === "pts") {
        const d = ri(2, 6), h = ri(-9 + d, 9 - d), a = pick([1, 0.5, 0.25]) * (up ? 1 : -1), k = ri(-8, 8), y0 = k + a * d * d;
        if (!Number.isInteger(y0) || Math.abs(y0) > 9 || h === 0) continue;
        p = { type, a, h, k, d, y0, x1: h - d, x2: h + d, up };
      } else if (type === "sign") {
        const r = ri(-8, 6), w = ri(2, 8), s = r + w;
        if (s > 8) continue;
        const half = w / 2, a = (up ? 1 : -1) * Math.min(1, 6 / (half * half));
        p = { type, a, h: (r + s) / 2, k: -a * half * half, r, s, up, clue };
      } else {
        const sign = pick([-1, -1, 1, 1, 0]), k = sign * ri(2, 5);
        p = { type, a: (up ? 1 : -1) * 0.5, h: ri(-5, 5), k, up, clue, sign, count: k === 0 ? 1 : (k < 0) === up ? 2 : 0 };
      }
      return p;
    }
  }
  const clueText = p => (p.clue === "diff" ? `The second differences are ${p.up ? "positive" : "negative"}.` : p.clue === "a" ? `a is ${p.up ? "positive" : "negative"}.` : `It opens ${p.up ? "up" : "down"}.`);
  const dirLine = p => (p.clue === "diff" ? `Second differences ${p.up ? "positive" : "negative"} means a is ${p.up ? "positive" : "negative"}, so it opens ${p.up ? "up" : "down"}`
    : p.clue === "a" ? `a is ${p.up ? "positive" : "negative"}, so it opens ${p.up ? "up" : "down"}` : `It opens ${p.up ? "up" : "down"}`);

  function newThink() {
    const p = genThink(cur.t);
    Object.assign(p, { tries: 0, done: false, sel: null, first: {} });
    cur.t = p;
    const line = `<span id="tLine"></span>`;
    if (p.type === "pts") {
      $("tNote").innerHTML = `<div class="given"><b>Points</b> (${fmt(p.x1)}, ${fmt(p.y0)}) and (${fmt(p.x2)}, ${fmt(p.y0)})</div><div class="given">Both are on the same parabola.</div>${line}`;
      $("tQs").innerHTML = qHTML("t", "axis");
    } else if (p.type === "sign") {
      $("tNote").innerHTML = `<div class="given"><b>Zeroes</b> ${fmt(p.r)} and ${fmt(p.s)}</div><div class="given">${clueText(p)}</div>${line}`;
      $("tQs").innerHTML = row("minmax", "Vertex is a", segMini("t-minmax", [["min", "Minimum"], ["max", "Maximum"]])) +
        row("optsign", "Optimal value is", segMini("t-optsign", [["pos", "Positive"], ["neg", "Negative"]]));
    } else {
      $("tNote").innerHTML = `<div class="given"><b>Optimal value</b> is ${p.sign < 0 ? "negative" : p.sign > 0 ? "positive" : "0"}.</div><div class="given">${clueText(p)}</div>${line}`;
      $("tQs").innerHTML = row("count", "Number of zeroes", segMini("t-count", [["0", "0"], ["1", "1"], ["2", "2"]]));
    }
    $("tScore").textContent = "";
    hover = null;
    syncUI();
    drawG();
  }

  const T = {
    list: "tQs", score: "tScore", binary: new Set(["minmax", "optsign"]),
    grade: (id, el, p) => (id === "axis" ? numGrade(el, [p.h]) : radGrade(el, id === "minmax" ? (p.up ? "min" : "max") : id === "optsign" ? (p.up ? "neg" : "pos") : String(p.count))),
    answer: (id, p) => (id === "axis" ? `x = ${fmt(p.h)}` : id === "minmax" ? (p.up ? "Minimum" : "Maximum") : id === "optsign" ? (p.up ? "Negative" : "Positive") : String(p.count)),
    diag(id, p, n) {
      if (id !== "axis" || Number.isNaN(n[0])) return null;
      if (near(n[0], p.y0) && p.y0 !== p.h) return "That is the y value. Use the two x values.";
      if (near(n[0], p.x1 + p.x2)) return "Now divide by 2.";
      if (near(n[0], p.x1) || near(n[0], p.x2)) return "That is one of the points. The axis is halfway between them.";
      if (near(n[0], p.d) || near(n[0], -p.d) || near(n[0], 2 * p.d)) return "Add the two x values, then divide by 2. Do not subtract.";
      if (near(n[0], -p.h)) return "Wrong sign.";
      return null;
    },
    hint: id => (id === "axis" ? "The points are at the same height, so the axis is halfway between them." : "Picture the vertex above or below the x axis, then open it the right way. Does it reach the x axis?"),
    steps(id, p) {
      const dir = p.up ? "up" : "down";
      if (id === "axis") return [`Both points have y = ${fmt(p.y0)}, so they are mirror images`, `x = (${fmt(p.x1)} + ${paren(p.x2)}) ÷ 2`, `x = ${fmt(p.h)}`];
      if (id === "minmax") return [dirLine(p), `The vertex is the ${p.up ? "lowest" : "highest"} point: a ${p.up ? "minimum" : "maximum"}`];
      if (id === "optsign") return [`It crosses the x axis at ${fmt(p.r)} and ${fmt(p.s)}`, `It opens ${dir}, so between the zeroes the curve is ${p.up ? "below" : "above"} the x axis`, `The optimal value is ${p.up ? "negative" : "positive"}`];
      const where = p.k === 0 ? "The optimal value is 0, so the vertex is on the x axis" : `The optimal value is ${p.k < 0 ? "negative" : "positive"}, so the vertex is ${p.k < 0 ? "below" : "above"} the x axis`;
      const end = p.count === 2 ? `Opening ${dir} from there, it crosses the x axis twice: 2 zeroes`
        : p.count === 0 ? `Opening ${dir} from there, it never reaches the x axis: no zeroes` : "It touches the x axis only at the vertex: 1 zero";
      return [dirLine(p), where, end];
    },
    done() { $("tLine").textContent = "Tap any question to see the steps."; },
    retry() { $("tLine").textContent = "Fix the ones marked ✗, then check again."; }
  };

  function drawT() {
    const v = VG, p = cur.t;
    if (!v.W || !p) return;
    v.sx = v.sy = Math.min(v.W, v.H) / 21;
    v.ox = v.W / 2; v.oy = v.H / 2;
    const c = v.ctx;
    c.clearRect(0, 0, v.W, v.H);
    v.cv.style.cursor = "";
    const fs = Math.max(10, Math.min(14, v.sx * 0.5)), lfs = fs + 2;
    grid(v, 1, 1, 2, 2, fs);
    const ink = css("--ink"), hl = css("--hl"), red = css("--c2"), blue = css("--c1");
    const f = x => p.a * (x - p.h) * (x - p.h) + p.k;
    const vx = X(v, p.h), vy = Y(v, p.k), s = p.a > 0 ? 1 : -1;
    if (p.done) {
      line(v, vx, 0, vx, v.H, p.type === "pts" ? hl : ink, p.type === "pts" ? 4 : 1.5, p.type === "pts" ? [8, 6] : [4, 5], p.type === "pts" ? 1 : 0.45);
      curve(v, f, css("--curve"), 3.5);
    }
    if (p.type === "pts") {
      line(v, X(v, p.x1), Y(v, p.y0), X(v, p.x2), Y(v, p.y0), blue, 2, [5, 5], 0.6);
      [p.x1, p.x2].forEach((x, i) => {
        dot(v, X(v, x), Y(v, p.y0), blue, 7);
        label(v, `(${fmt(x)}, ${fmt(p.y0)})`, X(v, x) + (i === 0 ? -12 : 12), Y(v, p.y0), blue, i === 0 ? "right" : "left", "middle", lfs);
      });
      if (p.done) label(v, `x = ${fmt(p.h)}`, vx + 8, v.H - 8, hl, "left", "bottom", lfs);
      return;
    }
    if (p.type === "sign") {
      [p.r, p.s].forEach((z, i) => {
        dot(v, X(v, z), Y(v, 0), red, 7);
        label(v, `(${fmt(z)}, 0)`, X(v, z) + (i === 0 ? -10 : 10), Y(v, 0) + (p.done ? s * 12 : 12), red, i === 0 ? "right" : "left", !p.done || s > 0 ? "top" : "bottom", lfs);
      });
      if (p.done) {
        halo(v, vx, vy);
        dot(v, vx, vy, ink, 7);
        label(v, `${p.up ? "minimum" : "maximum"}, ${p.up ? "negative" : "positive"}`, vx, vy + s * 14, ink, "center", s > 0 ? "top" : "bottom", lfs);
      }
      return;
    }
    if (p.done && p.count === 2) {
      const dz = Math.sqrt(-p.k / p.a);
      [p.h - dz, p.h + dz].forEach(z => { halo(v, X(v, z), Y(v, 0)); dot(v, X(v, z), Y(v, 0), red, 7); });
    }
    if (p.done && p.count === 1) halo(v, vx, vy);
    dot(v, vx, vy, p.done && p.count === 1 ? red : ink, 7);
    label(v, p.done ? (p.count === 0 ? "no zeroes" : p.count === 1 ? "1 zero" : "2 zeroes") : "vertex", vx + 12, vy + s * 12, p.done ? red : ink, "left", s > 0 ? "top" : "bottom", lfs);
  }

  // =====================================================================
  // shared wiring
  // =====================================================================
  const MODES = ["e", "g", "d", "f", "w", "t"];
  const NEW = { e: newEq, g: newGraph, d: newDiff, f: newFind, w: newWord, t: newThink };
  const CHECK = {
    e: checkE, g: checkG, f: () => checkList("f", F), w: () => checkList("w", W), t: () => checkList("t", T),
    d: () => (cur.d.given === "table" ? checkD() : checkList("d", cur.d.given === "eq" ? DEG : SHAPE))
  };
  const appEl = document.querySelector(".app");
  function syncUI() {
    const p = cur[mode];
    if (!p) return;
    const veiled = (mode === "e" || mode === "w") && !p.done;
    $("bCheck").hidden = p.done;
    $("bCheck").textContent = p.tries ? "Check again" : "Check";
    $("bNew").textContent = p.done ? "Next one" : "New";
    $("bNew").classList.toggle("primary", p.done);
    $("eFocus").hidden = mode !== "e";
    $("veil").hidden = !veiled;
    appEl.classList.toggle("hide-stage", veiled);
    $("warn").textContent = "";
    renderProgress();
  }
  function setMode(m) {
    mode = m;
    $("gWrap").hidden = m === "d";
    $("dWrap").hidden = m !== "d";
    MODES.forEach(k => { $(`${k}Body`).hidden = k !== m; });
    hover = null;
    if (!cur[m]) NEW[m]();
    else syncUI();
    requestAnimationFrame(() => { resizeG(); resizeD(); });
  }

  MODES.forEach(k => $(`m${k.toUpperCase()}`).addEventListener("change", () => setMode(k)));
  $("bCheck").addEventListener("click", () => CHECK[mode]());
  // a question he has started has to be checked before moving on
  const started = () => {
    const p = cur[mode];
    if (!p || p.done) return false;
    if (p.tries) return true;
    const scope = mode === "d" ? "#dt input, #dQs input" : `#${mode}Qs input`;
    return qsa(scope).some(i => (i.type === "text" ? i.value.trim() !== "" : i.checked));
  };
  $("bNew").addEventListener("click", () => {
    if (started()) { $("warn").textContent = "Check your answers first."; return; }
    NEW[mode]();
  });
  $("eFocus").addEventListener("change", newEq);
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches && e.target.matches("input.num")) CHECK[mode]();
  });
  $("gQs").addEventListener("change", e => {
    if (e.target.id !== "g-none") return;
    ["g-r1", "g-r2"].forEach(id => {
      const i = $(id);
      i.disabled = e.target.checked;
      if (e.target.checked) i.value = "";
    });
  });
  MODES.forEach(k => $(`${k}Qs`).addEventListener("click", e => {
    const el = e.target.closest(".q");
    const p = cur[mode];
    if (!el || !p || !p.done) return;
    const was = el.classList.contains("open");
    qsa(`#${k}Qs .q.open`).forEach(x => x.classList.remove("open"));
    if (!was) el.classList.add("open");
    p.sel = was ? null : el.dataset.id;
    if (mode !== "d") drawG();
  }));
  $("prog").addEventListener("click", e => {
    if (e.target.id !== "bReset") return;
    if (!armed) {
      armed = true;
      renderProgress();
      setTimeout(() => { if (armed) { armed = false; renderProgress(); } }, 3000);
      return;
    }
    armed = false;
    stats = {};
    saveStats();
    renderProgress();
  });

  const setHover = e => {
    const p = mode === "e" ? cur.e : mode === "g" ? cur.g : mode === "f" ? cur.f : null;
    if (!p || !p.done) return;
    const r = VG.cv.getBoundingClientRect();
    hover = [e.clientX - r.left, e.clientY - r.top];
    drawG();
  };
  VG.cv.addEventListener("pointermove", setHover);
  VG.cv.addEventListener("pointerdown", setHover);
  VG.cv.addEventListener("pointerleave", e => {
    if (e.pointerType === "mouse" && hover) { hover = null; drawG(); }
  });

  new ResizeObserver(resizeG).observe(VG.cv);
  new ResizeObserver(resizeD).observe(VD.cv);
  const redraw = () => { drawG(); drawD(); };
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);

  setMode("e");
})();
</script>
</body>
</html>
